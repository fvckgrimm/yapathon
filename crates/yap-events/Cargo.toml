[package]
name = "yap-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chat platform events that extend a yapathon goal"

[dependencies]
yap-core = { path = "../yap-core" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
async-trait = "0.1"
uuid.workspace = true

# EventSub over WebSocket. No inbound endpoint is needed, which matters for an
# app running on a streamer's machine behind NAT.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
reqwest.workspace = true
keyring.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true