name: Build and release yap-a-thon
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Pinned third-party toolchain versions. Bump these, not the steps below.
env:
  CUDA_VERSION: '12.8.1'
  VULKAN_SDK_VERSION: '1.4.309.0'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU builds: the default everyone should start with.
          - os: ubuntu-latest
            artifact_name: yap-a-thon-linux-x86_64
            binary_name: yap-a-thon
            cargo_features: ''
            backend: cpu
          - os: windows-latest
            artifact_name: yap-a-thon-windows-x86_64
            binary_name: yap-a-thon.exe
            cargo_features: ''
            backend: cpu
          # GPU builds: same app, whisper compiled for the matching backend.
          # Slow — the CUDA ones especially (nvcc builds whisper for every GPU
          # arch, ~30-60 min). CPU results are identical, just slower at runtime.
          - os: ubuntu-latest
            artifact_name: yap-a-thon-linux-x86_64-cuda
            binary_name: yap-a-thon
            cargo_features: '--features yap-voice/whisper-cuda'
            backend: cuda
          - os: ubuntu-latest
            artifact_name: yap-a-thon-linux-x86_64-vulkan
            binary_name: yap-a-thon
            cargo_features: '--features yap-voice/whisper-vulkan'
            backend: vulkan
          # CUDA 12.8's nvcc predates VS18 (MSVC 14.51) on windows-latest, so
          # enable_language(CUDA) fails with "No CUDA toolset found".
          # windows-2022 has VS17 which 12.8 supports. Revisit when bumping
          # CUDA_VERSION to 13.x.
          - os: windows-2022
            artifact_name: yap-a-thon-windows-x86_64-cuda
            binary_name: yap-a-thon.exe
            cargo_features: '--features yap-voice/whisper-cuda'
            backend: cuda
          - os: windows-latest
            artifact_name: yap-a-thon-windows-x86_64-vulkan
            binary_name: yap-a-thon.exe
            cargo_features: '--features yap-voice/whisper-vulkan'
            backend: vulkan
          # macOS is untested locally (no Apple toolchain here) but builds on
          # the hosted runner with the Metal backend. Included anyway.
          - os: macos-latest
            artifact_name: yap-a-thon-macos-aarch64
            binary_name: yap-a-thon
            cargo_features: '--features yap-voice/whisper-metal'
            backend: metal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # whisper.cpp's nested vulkan-shaders-gen ExternalProject does a second
      # CMake configure deep under target/. On Windows the default
      # D:\a\...\target path plus that nesting exceeds MAX_PATH and VS18
      # MSBuild FileTracker fails with FTK1011, breaking cl.exe TryCompile.
      # A short target dir avoids it. Must run before the cache step so the
      # cache sees the same dir. Linux/macOS keep the default `target`.
      - name: Shorten target dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      # whisper-rs runs bindgen at build time (libclang), cpal needs ALSA,
      # keyring needs dbus, and GPUI's font stack needs freetype + fontconfig
      # (yeslogic-fontconfig-sys fails on fontconfig.pc without it) — all
      # system packages on Linux, none of which are vendored.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libdbus-1-dev libfreetype6-dev libfontconfig1-dev libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      # Same bindgen requirement on Windows: whisper always runs it, even for
      # CPU-only builds. choco's LLVM is found via the standard install path.
      - name: Install LLVM (bindgen libclang)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install llvm -y

      # nvcc compiles fine with no GPU present; the runners only build.
      # Slim sub-package set: full toolkit is ~4 GB / ~20 min extra.
      # v0.2.36+ knows CUDA 12.8.1; v0.2.21 stopped at 12.8.0 and fails with
      # "Version not available". Bump the action, not CUDA_VERSION, for new
      # patch releases.
      # Windows and Linux need different package names (installer components
      # vs apt), so the installs are separate steps. The Windows list is the
      # proven one: names pass through verbatim as <name>_12.8 and anything
      # else (e.g. cudart-dev with a hyphen) fails the installer.
      # visual_studio_integration is required: CMake's Visual Studio
      # generator maps nvcc through the CUDA MSBuild BuildCustomizations,
      # and without them enable_language(CUDA) dies with
      # "No CUDA toolset found" even though nvcc itself is present.
      # cublas_dev/curand_dev (underscore: installer component names) ship
      # the cublas headers and import libs; without them FindCUDAToolkit
      # finds the toolkit but creates no CUDA::cublas target and generate
      # fails at ggml's target_link_libraries.
      - name: Install CUDA toolkit (Windows)
        if: matrix.backend == 'cuda' && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "visual_studio_integration"]'

      # CUDA 12.8's host_config.h predates the image's MSVC (19.44+), so
      # nvcc fails its own compiler-ID try-compile and CMake dies with
      # "No CUDA toolset found" even though the toolkit is installed.
      # NVCC_PREPEND_FLAGS is read by nvcc itself on every invocation
      # (no CMake/build.rs involvement), so this covers configure and build.
      - name: Allow newer MSVC with CUDA 12.8 (Windows)
        if: matrix.backend == 'cuda' && runner.os == 'Windows'
        shell: bash
        run: echo "NVCC_PREPEND_FLAGS=-allow-unsupported-compiler" >> "$GITHUB_ENV"

      # Same repo setup the action does (keyring + pin + repo), then exact
      # apt names verified against NVIDIA's Packages index: cublas/curand
      # ship as libcublas(-dev)/libcurand(-dev), and whisper needs the -dev
      # variants for headers and .so links at build time.
      - name: Install CUDA toolkit (Linux)
        if: matrix.backend == 'cuda' && runner.os == 'Linux'
        shell: bash
        run: |
          UBUNTU_VERSION="$(lsb_release -sr | tr -d .)"
          CUDA_MM="$(echo "$CUDA_VERSION" | cut -d. -f1,2 | tr . -)"
          wget "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VERSION}/x86_64/cuda-keyring_1.1-1_all.deb" -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          wget "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VERSION}/x86_64/cuda-ubuntu${UBUNTU_VERSION}.pin" -O /tmp/cuda.pin
          sudo mv /tmp/cuda.pin /etc/apt/preferences.d/cuda-repository-pin-600
          sudo add-apt-repository "deb http://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VERSION}/x86_64/ /"
          sudo apt-get update
          sudo apt-get install -y \
            "cuda-nvcc-${CUDA_MM}" "cuda-cudart-${CUDA_MM}" "cuda-cudart-dev-${CUDA_MM}" \
            "libcublas-${CUDA_MM}" "libcublas-dev-${CUDA_MM}" \
            "libcurand-${CUDA_MM}" "libcurand-dev-${CUDA_MM}"
          # The debs install to /usr/local/cuda-<major.minor> with no `cuda`
          # symlink and nothing on PATH, so CMake's enable_language(CUDA)
          # fails with "No CMAKE_CUDA_COMPILER could be found" and whisper's
          # build script (which hardcodes link-search /usr/local/cuda/lib64)
          # can't link. The Jimver action used to provide all three.
          CUDA_DIR="/usr/local/cuda-$(echo "$CUDA_VERSION" | cut -d. -f1,2)"
          sudo ln -sfn "$CUDA_DIR" /usr/local/cuda
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDACXX=/usr/local/cuda/bin/nvcc" >> "$GITHUB_ENV"

      # Pinned LunarG installer (Windows); bump VULKAN_SDK_VERSION at the top,
      # not here. If LunarG renames the URL scheme this is the step that
      # breaks — the error is loud (404) and the fix is the version string.
      # Linux instead uses distro packages: the loader/headers plus glslc,
      # which is what whisper's build invokes to compile its shaders.
      - name: Install Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -o /tmp/VulkanSDK.exe \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanSDK-${VULKAN_SDK_VERSION}-Installer.exe"
          /tmp/VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=C:/VulkanSDK/${VULKAN_SDK_VERSION}" >> "$GITHUB_ENV"
          echo "C:/VulkanSDK/${VULKAN_SDK_VERSION}/Bin" >> "$GITHUB_PATH"

      - name: Install Vulkan build deps (Linux)
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        shell: bash
        # FindVulkan requires the glslc binary, which ships in the `glslc`
        # package (source: shaderc), not glslang-tools (glslangValidator
        # only). Without it configure fails with
        # "Could NOT find Vulkan (missing: glslc)".
        run: sudo apt-get install -y libvulkan-dev glslang-tools glslc

      - name: Build (release)
        shell: bash
        run: cargo build --release --locked -p yap-app ${{ matrix.cargo_features }}

      # Downloaded-from-a-browser binaries get Gatekeeper-quarantined on macOS.
      # Ad-hoc signing does not replace notarization, but without it the binary
      # will not run at all; with it, right-click → Open works first launch.
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --force --sign - "target/release/${{ matrix.binary_name }}"

      - name: Stage bundle
        shell: bash
        run: |
          mkdir -p bundle
          BIN_DIR="${CARGO_TARGET_DIR:-target}/release"
          cp "$BIN_DIR/${{ matrix.binary_name }}" bundle/
          cp settings.example.toml bundle/
          cp README.md bundle/

      - name: Zip bundle (for release upload, Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: |
          cd bundle
          zip -r "../${{ matrix.artifact_name }}.zip" .

      - name: Zip bundle (for release upload, Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path bundle/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bundle/

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
